let current = 'login';

/* ---- Legend ---- */
document.getElementById('legend').innerHTML = Object.entries(ROLES)
  .map(([k,r]) => `<span><i style="background:${r.color}"></i>${r.ko}</span>`).join('');

/* ---- Nav ---- */
function buildNav(){
  const groups = {};
  SCREENS.forEach(s => { (groups[s.group] = groups[s.group] || []).push(s); });
  let html = '';
  Object.keys(ROLES).forEach(g => {
    if(!groups[g]) return;
    const r = ROLES[g];
    html += `<div class="navgroup" data-group="${g}"><div class="gh"><i style="background:${r.color}"></i>${r.ko}</div>`;
    groups[g].forEach(s => {
      html += `<div class="navitem" data-id="${s.id}" data-search="${(s.title+' '+s.reqId+' '+s.apiId).toLowerCase()}" onclick="select('${s.id}')">
        <span class="t">${s.title}</span><span class="id">${s.reqId} · ${s.apiId}</span></div>`;
    });
    html += `</div>`;
  });
  document.getElementById('navlist').innerHTML = html;
  document.getElementById('cnt').textContent = SCREENS.length;
}
function filterNav(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('.navitem').forEach(it => {
    it.classList.toggle('hide', q && !it.dataset.search.includes(q));
  });
  document.querySelectorAll('.navgroup').forEach(g => {
    const any = [...g.querySelectorAll('.navitem')].some(i => !i.classList.contains('hide'));
    g.style.display = any ? '' : 'none';
  });
}

/* ---- Render selected screen ---- */
function select(id){
  const s = byId(id); if(!s) return;
  current = id;
  const r = ROLES[s.group];

  document.querySelectorAll('.navitem').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  const activeItem = document.querySelector('.navitem.active');
  if(activeItem) activeItem.scrollIntoView({block:'nearest'});

  // crumb
  document.getElementById('crumb').innerHTML = `
    <span class="role" style="background:${r.color}22;color:${r.color};border:1px solid ${r.color}55">${r.ko}</span>
    <h2>${s.title}</h2>
    <div class="ids">
      ${s.method ? `<span class="method">${s.method}</span>`:''}
      <span class="idtag">요구 <b>${s.reqId}</b></span>
      <span class="idtag">API <b>${s.apiId}</b></span>
    </div>`;
  document.getElementById('url').textContent = (s.url || 'platform.local') ;
  document.getElementById('view').innerHTML = s.mock;

  // flow hint — outgoing links from interactions
  const outs = [...new Set((s.interactions||[]).filter(i=>i.go).map(i=>i.go))].map(byId).filter(Boolean);
  document.getElementById('flowhint').innerHTML = outs.length
    ? `<span class="lbl">다음 화면</span>` + outs.map(o=>`<button onclick="select('${o.id}')">${o.title} →</button>`).join('')
    : `<span class="lbl">종료 화면 · 진입 전용</span>`;

  // spec
  renderSpec(s);
  document.querySelector('.canvas').scrollTop = 0;
  document.querySelector('.spec').scrollTop = 0;
}

function renderSpec(s){
  const entries = (s.entries||[]).map(byId).filter(Boolean);
  const entriesHtml = entries.length
    ? entries.map(e=>`<button onclick="select('${e.id}')">${e.title}</button>`).join('')
    : `<span class="none">— 직접 진입 (로그인/외부)</span>`;

  const inter = (s.interactions||[]).map(i=>`
    <div class="icard">
      <div class="trig">${i.t}</div>
      <div class="act">${i.a}</div>
      <div class="tags">
        ${i.c && i.c!=='-' ? `<span class="cnd">조건 · ${i.c}</span>`:''}
        ${i.api && i.api!=='-' ? `<span class="api">${i.api}</span>`:''}
        ${i.go ? `<span class="go" onclick="select('${i.go}')">${(byId(i.go)||{}).title||i.go} →</span>`:''}
      </div>
    </div>`).join('');

  const rules = (s.rules||[]).map(x=>`<li>${x}</li>`).join('');
  const exc = (s.exceptions||[]).map(x=>`<li>${x}</li>`).join('');

  document.getElementById('spec').innerHTML = `
    <h3>화면 개요</h3>
    <div class="desc">${s.desc}</div>

    <h3>연관 식별자</h3>
    <div class="kv">
      <div class="row"><span class="k">요구사항</span><span class="v">${s.reqId}</span></div>
      <div class="row"><span class="k">API ID</span><span class="v">${s.apiId}</span></div>
      ${s.method?`<div class="row"><span class="k">METHOD</span><span class="v">${s.method}</span></div>`:''}
      ${s.url?`<div class="row"><span class="k">URL</span><span class="v">${s.url}</span></div>`:''}
    </div>

    <h3>진입 경로</h3>
    <div class="entries">${entriesHtml}</div>

    <h3>인터랙션 명세</h3>
    <div class="itable">${inter}</div>

    ${rules?`<h3>데이터 · 검증 규칙</h3><ul class="bullets">${rules}</ul>`:''}
    ${exc?`<h3>예외 · 제약</h3><ul class="bullets warn">${exc}</ul>`:''}
  `;
}

/* ---- Global: any element with data-goto navigates ---- */
document.getElementById('view').addEventListener('click', e => {
  const t = e.target.closest('[data-goto]');
  if(t){ e.stopPropagation(); select(t.dataset.goto); }
});

buildNav();
select('login');
</script></body>
</html>
