    body: `

/* ===================== 렌더링 엔진 (수정 불필요) ===================== */
const byId = (id) => SCREENS.find((s) => s.id === id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function renderNav(activeId) {
  const groups = [];
  for (const s of SCREENS) {
    let g = groups.find((x) => x.name === s.group);
    if (!g) groups.push((g = { name: s.group, items: [] }));
    g.items.push(s);
  }
  const html = groups.map((g) => `
    <div class="nav-group">
      <div class="grp-label">${esc(g.name || "기타")}</div>
      ${g.items.map((s) => `
        <div class="nav-item ${s.id === activeId ? "active" : ""}" data-nav="${s.id}" tabindex="0">
          <span>${esc(s.title)}</span><span class="id">${esc(s.id)}</span>
        </div>`).join("")}
    </div>`).join("");
  document.getElementById("nav").innerHTML = `<div class="pane-head">네비게이션</div>${html}`;
}

function renderSpec(s) {
  const overview = `<p style="margin:0; font-size:13px; line-height:1.5">${esc(s.purpose || "—")}</p>`;

  const ids = [];
  if (s.requirementId) ids.push(`<div class="api-row">요구사항 ID: <b>${esc(s.requirementId)}</b></div>`);
  for (const a of s.apis || []) {
    ids.push(`<div class="api-row"><span class="m">${esc(a.method || "—")}</span>${esc(a.path || "—")}
      <span class="fields">API ID: ${esc(a.apiId || "—")}</span>
    </div>`);
  }
  const idsHtml = ids.join("") || "<div class='api-row'>연관 식별자 없음</div>";

  const interactions = (s.interactions || []).map((i) => `<li>${esc(i)}</li>`).join("") || "<li>—</li>";

  document.getElementById("spec").innerHTML = `
    <div class="pane-head">화면 명세</div>
    <div class="spec-section"><h3>화면 개요</h3>${overview}</div>
    <div class="spec-section"><h3>연관 식별자</h3>${idsHtml}</div>
    <div class="spec-section"><h3>인터랙션 명세</h3><ul>${interactions}</ul></div>`;
}

function showScreen(id) {
  const s = byId(id) || SCREENS[0];
  if (!s) return;
  document.getElementById("scr-title").textContent = s.title;
  document.getElementById("scr-purpose").textContent = s.purpose || "";
  document.getElementById("scr-body").innerHTML = s.body || "";
  renderNav(s.id);
  renderSpec(s);
  if (location.hash.slice(1) !== s.id) history.replaceState(null, "", "#" + s.id);
  document.querySelector(".screen").scrollTop = 0;
}

// 전역 클릭 위임: data-nav 가진 요소 클릭 시 전환
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-nav]");
  if (t) { e.preventDefault(); showScreen(t.getAttribute("data-nav")); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const t = e.target.closest(".nav-item[data-nav]");
    if (t) showScreen(t.getAttribute("data-nav"));
  }
});
window.addEventListener("hashchange", () => showScreen(location.hash.slice(1)));

// 초기 진입
showScreen(location.hash.slice(1) || (SCREENS[0] && SCREENS[0].id));
</script></body>
